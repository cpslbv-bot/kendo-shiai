name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clé de signature stable (garde les données entre les mises à jour)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Importer les sons (kiai)
        run: |
          if [ -f www/audio/sources.txt ]; then
            while read -r name url; do
              [ -n "$url" ] && curl -sSL --fail -o "www/audio/$name" "$url" && echo "OK $name" || echo "ECHEC $name"
            done < www/audio/sources.txt
            git rm -q www/audio/sources.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add www/audio
            git commit -m "Import des sons de kiai" && git push || echo "rien a pousser"
          fi

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Générer le projet Android
        run: |
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KendoShiai.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kendo Shiai - version ${{ github.run_number }}
          files: KendoShiai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KendoShiai-apk
          path: KendoShiai.apk
